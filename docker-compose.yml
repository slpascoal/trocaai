services:
  app:
    build:
      context: .
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trocaai
      POSTGRES_USER: trocaai
      POSTGRES_PASSWORD: trocaai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trocaai -d trocaai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-node-modules:
  postgres-data: